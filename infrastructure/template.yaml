AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: >

  RuztIQ serverless fraud detection pipeline.

  Exposes a fraud scoring API through API Gateway

  and processes transactions with Lambda and PostgreSQL.

Parameters:

  DBSecretArn:
    Type: String
    Description: ARN of the PostgreSQL database secret in AWS Secrets Manager

  ApiAuthSecretArn:
    Type: String
    Description: ARN of the RuztIQ API authentication secret in AWS Secrets Manager

Globals:

  Api:
    Auth:
      Authorizers:
        RuztIQApiAuthorizer:
          FunctionPayloadType: REQUEST
          FunctionArn: !GetAtt RuztIQApiAuthorizerFunction.Arn
          Identity:
            Headers:
              - Authorization

    MethodSettings:
      - ResourcePath: /score
        HttpMethod: POST
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40


Resources:

  RuztIQApiAuthorizerFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: ..
      Handler: src/lambda_function/authorizer.lambda_handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 128

      Policies:
        - AWSLambdaBasicExecutionRole

        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref ApiAuthSecretArn

      Environment:
        Variables:
          AWS_REGION_NAME: !Ref AWS::Region
          API_AUTH_SECRET_NAME: sentineliq/api/auth


  FraudDetectionFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: ..
      Handler: src/lambda_function/handler.lambda_handler
      Runtime: python3.11
      Timeout: 60
      MemorySize: 256

      VpcConfig:
        SecurityGroupIds:
          - sg-028fe4b2505cf5132
        SubnetIds:
          - subnet-0a08dd16941d5025e

      Events:
        ScoreTransaction:
          Type: Api
          Properties:
            Path: /score
            Method: post
            Auth:
              Authorizer: RuztIQApiAuthorizer

      Policies:
        - AWSLambdaBasicExecutionRole

        - AWSLambdaVPCAccessExecutionRole

        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DBSecretArn

        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"

      Environment:
        Variables:
          AWS_REGION_NAME: !Ref AWS::Region
          DB_SECRET_NAME: sentineliq/rds/postgres
          DB_HOST: sentineliq-postgres.clsq8ogwm7qk.eu-west-1.rds.amazonaws.com
          DB_PORT: '5432'
          DB_NAME: fintech_fraud


  FraudDetectionFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmDescription: >
        Alerts when the RuztIQ fraud detection Lambda records one or more errors.

      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref FraudDetectionFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1

      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching


  FraudDetectionFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmDescription: >
        Alerts when the RuztIQ fraud detection Lambda is throttled.

      Namespace: AWS/Lambda
      MetricName: Throttles

      Dimensions:
        - Name: FunctionName
          Value: !Ref FraudDetectionFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1

      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching


  ApiGateway5XXAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmDescription: >
        Alerts when the RuztIQ API Gateway records server-side 5XX errors.

      Namespace: AWS/ApiGateway
      MetricName: 5XXError

      Dimensions:
        - Name: ApiName
          Value: sentineliq

        - Name: Stage
          Value: Prod

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1

      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching


  ApiGateway4XXAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmDescription: >
        Alerts when the RuztIQ API Gateway records an elevated number
        of client-side 4XX responses.

      Namespace: AWS/ApiGateway
      MetricName: 4XXError

      Dimensions:
        - Name: ApiName
          Value: sentineliq

        - Name: Stage
          Value: Prod

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 10

      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching


  ApiGatewayLatencyAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmDescription: >
        Alerts when average RuztIQ API Gateway latency reaches three seconds.

      Namespace: AWS/ApiGateway
      MetricName: Latency

      Dimensions:
        - Name: ApiName
          Value: sentineliq

        - Name: Stage
          Value: Prod

      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 3000

      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching


Outputs:

  ApiEndpoint:
    Description: RuztIQ Fraud Detection API Endpoint
    Value:
      !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/score"


  FraudDetectionFunctionArn:
    Description: RuztIQ Fraud Detection Lambda ARN
    Value:
      !GetAtt FraudDetectionFunction.Arn


  RuztIQApiAuthorizerFunctionArn:
    Description: RuztIQ API Lambda authorizer ARN
    Value:
      !GetAtt RuztIQApiAuthorizerFunction.Arn
