AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  RuztIQ serverless fraud detection pipeline.
  Exposes a fraud scoring API through API Gateway,
  processes transactions with Lambda and DynamoDB,
  and synchronizes fraud results to PostgreSQL.

Parameters:

  DBSecretArn:
    Type: String
    Description: ARN of the PostgreSQL database secret in AWS Secrets Manager

  TransactionsTableArn:
    Type: String
    Description: ARN of the existing Transactions DynamoDB table

  FraudResultsTableArn:
    Type: String
    Description: ARN of the existing FraudResults DynamoDB table

  CustomerProfilesTableArn:
    Type: String
    Description: ARN of the existing CustomerProfiles DynamoDB table

  FraudResultsStreamArn:
    Type: String
    Description: ARN of the existing FraudResults DynamoDB Stream


Resources:

  FraudDetectionFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: ..
      Handler: src/lambda_function/handler.lambda_handler
      Runtime: python3.11
      Timeout: 60
      MemorySize: 256

      Events:
        ScoreTransaction:
          Type: Api
          Properties:
            Path: /score
            Method: post

      Policies:

        - AWSLambdaBasicExecutionRole

        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Ref TransactionsTableArn
                - !Sub "${TransactionsTableArn}/index/*"
                - !Ref FraudResultsTableArn
                - !Ref CustomerProfilesTableArn

        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"

      Environment:
        Variables:
          AWS_REGION_NAME: !Ref AWS::Region
          TRANSACTIONS_TABLE: Transactions
          FRAUD_RESULTS_TABLE: FraudResults
          CUSTOMER_PROFILES_TABLE: CustomerProfiles


  FraudResultsSyncFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: ..
      Handler: src/lambda_function/sync_handler.lambda_handler
      Runtime: python3.11
      Timeout: 60
      MemorySize: 256

      VpcConfig:
        SecurityGroupIds:
          - sg-028fe4b2505cf5132
        SubnetIds:
          - subnet-0a08dd16941d5025e

      Events:
        FraudResultsStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref FraudResultsStreamArn
            StartingPosition: LATEST
            BatchSize: 10

      Policies:

        - AWSLambdaBasicExecutionRole

        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:DescribeStream
                - dynamodb:ListStreams
              Resource:
                - !Ref FraudResultsStreamArn

        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DBSecretArn

      Environment:
        Variables:
          DB_SECRET_NAME: sentineliq/rds/postgres
          DB_HOST: sentineliq-postgres.clsq8ogwm7qk.eu-west-1.rds.amazonaws.com
          DB_PORT: '5432'
          DB_NAME: fintech_fraud


Outputs:

  ApiEndpoint:
    Description: RuztIQ Fraud Detection API Endpoint
    Value:
      !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/score"

  FraudDetectionFunctionArn:
    Description: RuztIQ Fraud Detection Lambda ARN
    Value:
      !GetAtt FraudDetectionFunction.Arn

  FraudResultsSyncFunctionArn:
    Description: RuztIQ DynamoDB to PostgreSQL synchronization Lambda ARN
    Value:
      !GetAtt FraudResultsSyncFunction.Arn

  TransactionsTableName:
    Description: Existing RuztIQ Transactions DynamoDB Table
    Value: Transactions

  FraudResultsTableName:
    Description: Existing RuztIQ Fraud Results DynamoDB Table
    Value: FraudResults

  CustomerProfilesTableName:
    Description: Existing RuztIQ Customer Profiles DynamoDB Table
    Value: CustomerProfiles

  FraudResultsStreamArnOutput:
    Description: Existing FraudResults DynamoDB Stream ARN
    Value:
      !Ref FraudResultsStreamArn