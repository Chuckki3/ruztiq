AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: SentinelIQ Fraud Detection Platform

Globals:
  Function:
    Runtime: python3.11
    Timeout: 900
    MemorySize: 512

Resources:

  ############################################################
  # Transactions Table
  ############################################################

  TransactionsTable:
    Type: AWS::DynamoDB::Table

    Properties:

      TableName: Transactions

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: transaction_reference
          AttributeType: S

      KeySchema:
        - AttributeName: transaction_reference
          KeyType: HASH

  ############################################################
  # Fraud Results Table
  ############################################################

  FraudResultsTable:
    Type: AWS::DynamoDB::Table

    Properties:

      TableName: FraudResults

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: transaction_reference
          AttributeType: S

      KeySchema:
        - AttributeName: transaction_reference
          KeyType: HASH

  ############################################################
  # Customer Profiles Table
  ############################################################

  CustomerProfilesTable:
    Type: AWS::DynamoDB::Table

    Properties:

      TableName: CustomerProfiles

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: N

      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH

  ############################################################
  # Lambda Function
  ############################################################

  FraudDetectionFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: ..

      Handler: src/lambda_function/handler.lambda_handler

      Runtime: python3.11

      Architectures:
        - x86_64

      Events:

        ScoreAPI:

          Type: Api

          Properties:

            Path: /score

            Method: post

      Policies:

        - AWSLambdaBasicExecutionRole

        ####################################################
        # DynamoDB Permissions
        ####################################################

        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref FraudResultsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerProfilesTable

        ####################################################
        # CloudWatch Metrics
        ####################################################

        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"

      Environment:

        Variables:

          ##################################################
          # Existing
          ##################################################

          BATCH_SIZE: "100"

          TRANSACTIONS_TABLE: !Ref TransactionsTable

          FRAUD_RESULTS_TABLE: !Ref FraudResultsTable

          ##################################################
          # NEW
          ##################################################

          CUSTOMER_PROFILES_TABLE: !Ref CustomerProfilesTable

Outputs:

  ############################################################
  # Lambda
  ############################################################

  FraudDetectionFunction:
    Description: Lambda ARN
    Value: !GetAtt FraudDetectionFunction.Arn

  ############################################################
  # API Gateway
  ############################################################

  ApiEndpoint:
    Description: API Gateway Endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/score"

  ############################################################
  # Tables
  ############################################################

  TransactionsTableName:
    Description: Transactions Table
    Value: !Ref TransactionsTable

  FraudResultsTableName:
    Description: Fraud Results Table
    Value: !Ref FraudResultsTable

  CustomerProfilesTableName:
    Description: Customer Profiles Table
    Value: !Ref CustomerProfilesTable