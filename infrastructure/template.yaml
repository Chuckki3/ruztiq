AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  RuztIQ serverless fraud detection pipeline.
  Exposes a fraud scoring API through API Gateway and Lambda,
  with DynamoDB-backed transaction, customer profile, and fraud
  result persistence.

Parameters:
  ApiAuthSecretArn:
    Type: String
    Description: ARN of the RuztIQ API authentication secret in AWS Secrets Manager

Globals:
  Api:
    Auth:
      Authorizers:
        RuztIQApiAuthorizer:
          FunctionPayloadType: REQUEST
          FunctionArn: !GetAtt RuztIQApiAuthorizerFunction.Arn
          Identity:
            Headers:
              - Authorization
    MethodSettings:
      - ResourcePath: /score
        HttpMethod: POST
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40

Resources:

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: Transactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: N
        - AttributeName: transaction_key
          AttributeType: S
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
        - AttributeName: transaction_key
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: RuztIQ
        - Key: Component
          Value: Transactions

  CustomerProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: CustomerProfiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: N
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: RuztIQ
        - Key: Component
          Value: CustomerProfiles

  FraudResultsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: FraudResults
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transaction_reference
          AttributeType: S
      KeySchema:
        - AttributeName: transaction_reference
          KeyType: HASH
      Tags:
        - Key: Project
          Value: RuztIQ
        - Key: Component
          Value: FraudResults

  RuztIQApiAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src/lambda_function/authorizer.lambda_handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 128
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref ApiAuthSecretArn
      Environment:
        Variables:
          AWS_REGION_NAME: !Ref AWS::Region
          API_AUTH_SECRET_NAME: sentineliq/api/auth

  FraudDetectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src/lambda_function/handler.lambda_handler
      Runtime: python3.11
      Timeout: 60
      MemorySize: 256

      Events:
        ScoreTransaction:
          Type: Api
          Properties:
            Path: /score
            Method: post
            Auth:
              Authorizer: RuztIQApiAuthorizer

      Policies:
        - AWSLambdaBasicExecutionRole

        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt TransactionsTable.Arn
                - !GetAtt CustomerProfilesTable.Arn
                - !GetAtt FraudResultsTable.Arn

        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"

      Environment:
        Variables:
          AWS_REGION_NAME: !Ref AWS::Region
          TRANSACTIONS_TABLE: !Ref TransactionsTable
          CUSTOMER_PROFILES_TABLE: !Ref CustomerProfilesTable
          FRAUD_RESULTS_TABLE: !Ref FraudResultsTable

  FraudDetectionFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-FraudDetectionFunction-Errors"
      AlarmDescription: Alerts when the fraud detection Lambda reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FraudDetectionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  FraudDetectionFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-FraudDetectionFunction-Throttles"
      AlarmDescription: Alerts when the fraud detection Lambda is throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref FraudDetectionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiGateway5XXAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-ApiGateway-5XX"
      AlarmDescription: Alerts when API Gateway returns 5XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiGateway4XXAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-ApiGateway-4XX"
      AlarmDescription: Alerts when API Gateway returns 4XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiGatewayLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-ApiGateway-Latency"
      AlarmDescription: Alerts when API Gateway latency becomes elevated.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint:
    Description: RuztIQ Fraud Detection API Endpoint
    Value:
      !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/score"

  FraudDetectionFunctionArn:
    Description: RuztIQ fraud detection Lambda ARN
    Value: !GetAtt FraudDetectionFunction.Arn

  RuztIQApiAuthorizerFunctionArn:
    Description: RuztIQ API authorizer Lambda ARN
    Value: !GetAtt RuztIQApiAuthorizerFunction.Arn

  TransactionsTableName:
    Description: RuztIQ transactions DynamoDB table
    Value: !Ref TransactionsTable

  CustomerProfilesTableName:
    Description: RuztIQ customer profiles DynamoDB table
    Value: !Ref CustomerProfilesTable

  FraudResultsTableName:
    Description: RuztIQ fraud results DynamoDB table
    Value: !Ref FraudResultsTable