AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: SentinelIQ Fraud Detection Platform

Globals:
  Function:
    Runtime: python3.11
    Timeout: 900
    MemorySize: 512

Resources:

  ############################################################
  # Transactions Table
  ############################################################

  TransactionsTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: Transactions

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: transaction_reference
          AttributeType: S

      KeySchema:
        - AttributeName: transaction_reference
          KeyType: HASH

  ############################################################
  # Fraud Results Table
  ############################################################

  FraudResultsTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: FraudResults

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: transaction_reference
          AttributeType: S

      KeySchema:
        - AttributeName: transaction_reference
          KeyType: HASH

  ############################################################
  # Customer Profiles Table
  ############################################################

  CustomerProfilesTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: CustomerProfiles

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: N

      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH

  ############################################################
  # Fraud Detection Lambda
  ############################################################

  FraudDetectionFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: ..

      Handler: src/lambda_function/handler.lambda_handler

      Runtime: python3.11

      Architectures:
        - x86_64

      Timeout: 900

      MemorySize: 512

      ########################################################
      # API Gateway
      ########################################################

      Events:
        ScoreAPI:
          Type: Api

          Properties:
            Path: /score
            Method: post

      ########################################################
      # Lambda IAM Permissions
      ########################################################

      Policies:

        - AWSLambdaBasicExecutionRole

        ######################################################
        # Transactions permissions
        ######################################################

        - DynamoDBCrudPolicy:
            TableName: Transactions

        ######################################################
        # Fraud Results permissions
        ######################################################

        - DynamoDBCrudPolicy:
            TableName: FraudResults

        ######################################################
        # Customer Profiles permissions
        ######################################################

        - DynamoDBCrudPolicy:
            TableName: CustomerProfiles

        ######################################################
        # CloudWatch Metrics
        ######################################################

        - Statement:
            - Effect: Allow

              Action:
                - cloudwatch:PutMetricData

              Resource: "*"

      ########################################################
      # Environment Variables
      ########################################################

      Environment:
        Variables:

          # Application configuration
          BATCH_SIZE: "100"

          # Explicit DynamoDB table names
          TRANSACTIONS_TABLE: "Transactions"

          FRAUD_RESULTS_TABLE: "FraudResults"

          CUSTOMER_PROFILES_TABLE: "CustomerProfiles"

          # Explicit AWS region
          AWS_REGION: "eu-west-1"

  ############################################################
  # Outputs
  ############################################################

Outputs:

  ############################################################
  # Lambda
  ############################################################

  FraudDetectionFunctionArn:
    Description: SentinelIQ Fraud Detection Lambda ARN

    Value: !GetAtt FraudDetectionFunction.Arn

  ############################################################
  # API Gateway
  ############################################################

  ApiEndpoint:
    Description: SentinelIQ Fraud Detection API Endpoint

    Value:
      !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/score"

  ############################################################
  # DynamoDB Tables
  ############################################################

  TransactionsTableName:
    Description: SentinelIQ Transactions DynamoDB Table

    Value: Transactions

  FraudResultsTableName:
    Description: SentinelIQ Fraud Results DynamoDB Table

    Value: FraudResults

  CustomerProfilesTableName:
    Description: SentinelIQ Customer Profiles DynamoDB Table

    Value: CustomerProfiles