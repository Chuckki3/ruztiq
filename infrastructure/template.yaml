AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  SentinelIQ serverless fraud detection pipeline.
  Exposes a fraud scoring API through API Gateway,
  processes transactions with Lambda and DynamoDB,
  and synchronizes fraud results to PostgreSQL.

############################################################
# PARAMETERS
############################################################

Parameters:

  DBSecretArn:
    Type: String
    Description: ARN of the PostgreSQL database secret in AWS Secrets Manager

  TransactionsTableArn:
    Type: String
    Description: ARN of the existing Transactions DynamoDB table

  FraudResultsTableArn:
    Type: String
    Description: ARN of the existing FraudResults DynamoDB table

  CustomerProfilesTableArn:
    Type: String
    Description: ARN of the existing CustomerProfiles DynamoDB table

  FraudResultsStreamArn:
    Type: String
    Description: ARN of the existing FraudResults DynamoDB Stream


############################################################
# RESOURCES
############################################################

Resources:

  ##########################################################
  # FRAUD DETECTION FUNCTION
  ##########################################################

  FraudDetectionFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: ..

      Handler: src/lambda_function/handler.lambda_handler

      Runtime: python3.11

      Timeout: 60

      MemorySize: 256


      ######################################################
      # API GATEWAY
      ######################################################

      Events:

        ScoreTransaction:
          Type: Api

          Properties:
            Path: /score
            Method: post


      ######################################################
      # IAM PERMISSIONS
      ######################################################

      Policies:

        # Allow Lambda to write logs to CloudWatch Logs
        - AWSLambdaBasicExecutionRole


        # Allow access to SentinelIQ DynamoDB tables
        - Statement:

            - Effect: Allow

              Action:

                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan

              Resource:

                # Transactions table
                - !Ref TransactionsTableArn

                # Transactions table secondary indexes
                - !Sub "${TransactionsTableArn}/index/*"

                # Fraud results table
                - !Ref FraudResultsTableArn

                # Customer profiles table
                - !Ref CustomerProfilesTableArn


        # Allow publishing custom CloudWatch metrics
        - Statement:

            - Effect: Allow

              Action:

                - cloudwatch:PutMetricData

              Resource: "*"


      ######################################################
      # ENVIRONMENT VARIABLES
      ######################################################

      Environment:

        Variables:

          AWS_REGION_NAME: !Ref AWS::Region

          TRANSACTIONS_TABLE: Transactions

          FRAUD_RESULTS_TABLE: FraudResults

          CUSTOMER_PROFILES_TABLE: CustomerProfiles


  ##########################################################
  # FRAUD RESULTS SYNCHRONIZATION FUNCTION
  ##########################################################

  FraudResultsSyncFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: ..

      Handler: src/lambda_function/sync_handler.lambda_handler

      Runtime: python3.11

      Timeout: 60

      MemorySize: 256


      ######################################################
      # VPC CONFIGURATION
      ######################################################

      VpcConfig:

        SecurityGroupIds:

          - sg-028fe4b2505cf5132

        SubnetIds:

          - subnet-0a08dd16941d5025e


      ######################################################
      # DYNAMODB STREAM EVENT
      ######################################################

      Events:

        FraudResultsStream:

          Type: DynamoDB

          Properties:

            Stream: !Ref FraudResultsStreamArn

            StartingPosition: LATEST

            BatchSize: 10


      ######################################################
      # IAM PERMISSIONS
      ######################################################

      Policies:

        # Allow Lambda to write logs
        - AWSLambdaBasicExecutionRole


        # Allow Lambda to read DynamoDB Stream records
        - Statement:

            - Effect: Allow

              Action:

                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:DescribeStream
                - dynamodb:ListStreams

              Resource:

                - !Ref FraudResultsStreamArn


        # Allow Lambda to access PostgreSQL credentials
        - Statement:

            - Effect: Allow

              Action:

                - secretsmanager:GetSecretValue

              Resource:

                - !Ref DBSecretArn


############################################################
# OUTPUTS
############################################################

Outputs:

  ##########################################################
  # API ENDPOINT
  ##########################################################

  ApiEndpoint:

    Description: SentinelIQ Fraud Detection API Endpoint

    Value:
      !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/score"


  ##########################################################
  # FRAUD DETECTION FUNCTION ARN
  ##########################################################

  FraudDetectionFunctionArn:

    Description: SentinelIQ Fraud Detection Lambda ARN

    Value:
      !GetAtt FraudDetectionFunction.Arn


  ##########################################################
  # FRAUD RESULTS SYNC FUNCTION ARN
  ##########################################################

  FraudResultsSyncFunctionArn:

    Description: SentinelIQ DynamoDB to PostgreSQL synchronization Lambda ARN

    Value:
      !GetAtt FraudResultsSyncFunction.Arn


  ##########################################################
  # EXISTING DYNAMODB TABLES
  ##########################################################

  TransactionsTableName:

    Description: Existing SentinelIQ Transactions DynamoDB Table

    Value: Transactions


  FraudResultsTableName:

    Description: Existing SentinelIQ Fraud Results DynamoDB Table

    Value: FraudResults


  CustomerProfilesTableName:

    Description: Existing SentinelIQ Customer Profiles DynamoDB Table

    Value: CustomerProfiles


  ##########################################################
  # DYNAMODB STREAM
  ##########################################################

  FraudResultsStreamArnOutput:

    Description: Existing FraudResults DynamoDB Stream ARN

    Value:
      !Ref FraudResultsStreamArn